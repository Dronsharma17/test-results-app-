<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Results</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b35">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Offline Indicator -->
    <div id="offlineOverlay" class="offline-overlay hidden">
        <div class="offline-content">
            <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <h2>No Internet Connection</h2>
            <p>This app requires an internet connection to work. Please check your connection and try again.</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container">
        <!-- Tests List View -->
        <div id="testsListView" class="view active">
            <div class="header">
                <h1>Your tests</h1>
                <a href="#" class="view-all">View all</a>
            </div>

            <div class="tabs">
                <button class="tab">Upcoming</button>
                <button class="tab active">Past Tests</button>
                <button class="tab">Missed Tests</button>
            </div>

            <div class="test-carousel-container">
                <div id="testCarousel" class="test-carousel"></div>
            </div>

            <div class="promo-cards">
                <div class="promo-card">
                    <div class="promo-icon">📈</div>
                    <div class="promo-text">
                        <strong>Checked your Test Results?</strong><br>
                        Open your Improvement Book, revise the right questions, and feel confident
                    </div>
                    <div class="promo-arrow">›</div>
                </div>

                <div class="promo-card">
                    <div class="promo-icon">📊</div>
                    <div class="promo-text">
                        <strong>Analyse your performance</strong><br>
                        across tests
                    </div>
                    <div class="promo-arrow">›</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item" id="testsNavBtn">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>Tests</span>
        </button>
    </div>

    <script src="app.js"></script>
    <script src="github-sync.js"></script>

    <!-- Service Worker -->
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
    }
    </script>
</body>
</html>
